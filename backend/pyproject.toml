[project]
name = "backend"
version = "0.1.0"
description = "StudyMind backend API (FastAPI)"
readme = "README.md"
authors = [
    { name = "oussama-abid", email = "oussamaabid52@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "sqlalchemy>=2.1.8",
]


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]
