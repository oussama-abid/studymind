[project]
name = "backend"
version = "0.1.0"
description = "StudyMind backend API (FastAPI)"
readme = "README.md"
authors = [
    { name = "oussama-abid", email = "oussamaabid52@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
